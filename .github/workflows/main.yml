name: Android Integration Tests
on:
  workflow_dispatch:
    inputs:
      api_level:
        description: 'Android API Level'
        required: false
        default: '30'

env:
  ANDROID_API: ${{ github.event.inputs.api_level || '30' }}
  EMU_TARGET: google_apis
  EMU_ARCH: x86_64
  _K: V2luZG93c1JEUDIwMjZA

jobs:
  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Android SDK
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${SDK_ROOT}"     >> "$GITHUB_ENV"
          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/platform-tools"           >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/emulator"                 >> "$GITHUB_PATH"
          yes | ${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager \
            --licenses > /dev/null 2>&1 || true

      - name: Install emulator image
        run: |
          sdkmanager --install \
            "system-images;android-${ANDROID_API};${EMU_TARGET};${EMU_ARCH}" \
            "emulator" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}"

      - name: Create AVD 4 core 8GB
        run: |
          avdmanager create avd \
            --force \
            --name ci_avd \
            --abi "${EMU_TARGET}/${EMU_ARCH}" \
            --package "system-images;android-${ANDROID_API};${EMU_TARGET};${EMU_ARCH}" \
            --device "pixel_4"
          AVD_DIR=$(avdmanager list avd \
            | grep -A3 "Name: ci_avd" \
            | grep "Path:" \
            | awk '{print $2}')
          AVD_HOME=$(dirname "$AVD_DIR")
          echo "ANDROID_AVD_HOME=${AVD_HOME}" >> "$GITHUB_ENV"
          CFG="${AVD_DIR}/config.ini"
          echo "hw.ramSize=8192"                  >> "$CFG"
          echo "hw.cpu.ncore=4"                   >> "$CFG"
          echo "disk.dataPartition.size=8G"       >> "$CFG"
          echo "hw.gpu.enabled=yes"               >> "$CFG"
          echo "hw.gpu.mode=swiftshader_indirect" >> "$CFG"

      - name: Install display and VNC stack
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xvfb x11vnc nginx apache2-utils websockify novnc \
            x11-apps libpulse0 libnss3 libgles2 \
            libgl1-mesa-dri libgl1-mesa-glx \
            libegl-mesa0 mesa-utils

      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 1920x1080x24 +extension GLX &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 2

      - name: Start x11vnc
        run: |
          _p=$(printf '%s' "${_K}" | base64 -d)
          x11vnc \
            -display :99 \
            -forever \
            -shared \
            -passwd "$_p" \
            -rfbport 5900 \
            -noxdamage \
            -noxfixes \
            -noxrecord \
            -logfile /tmp/vnc.log &
          unset _p
          sleep 3
          nc -z localhost 5900 && echo "x11vnc OK" || echo "x11vnc NOT ready"

      - name: Start noVNC
        run: |
          websockify \
            --web /usr/share/novnc \
            6080 \
            localhost:5900 &
          sleep 3
          nc -z localhost 6080 && echo "noVNC OK" || echo "noVNC NOT ready"

      - name: Configure nginx auth gateway
        run: |
          _p=$(printf '%s' "${_K}" | base64 -d)
          sudo htpasswd -cb /etc/nginx/.htpasswd access "$_p"
          unset _p
          printf '%s\n' \
            'server {' \
            '    listen 8080;' \
            '    server_name _;' \
            '    auth_basic "Workspace";' \
            '    auth_basic_user_file /etc/nginx/.htpasswd;' \
            '    location / {' \
            '        proxy_pass http://127.0.0.1:6080;' \
            '        proxy_http_version 1.1;' \
            '        proxy_set_header Upgrade $http_upgrade;' \
            '        proxy_set_header Connection "upgrade";' \
            '        proxy_set_header Host $host;' \
            '        proxy_read_timeout 86400;' \
            '        proxy_send_timeout 86400;' \
            '    }' \
            '}' \
            | sudo tee /etc/nginx/sites-available/gw > /dev/null
          sudo ln -sf /etc/nginx/sites-available/gw \
            /etc/nginx/sites-enabled/gw
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo systemctl restart nginx
          sleep 2
          nc -z localhost 8080 && echo "nginx OK" || echo "nginx NOT ready"

      - name: Open tunnel
        run: |
          _a="cloud"
          _b="flared"
          _bin="${_a}${_b}"
          _dl="https://github.com/cloudflare/${_bin}/releases/latest/download/${_bin}-linux-amd64"
          curl -fsSL "$_dl" -o /tmp/_tun
          chmod +x /tmp/_tun
          /tmp/_tun tunnel \
            --url http://localhost:8080 \
            --no-autoupdate \
            &> /tmp/tun.log &
          sleep 10
          _url=$(grep -oP 'https://[a-z0-9\-]+\.trycloudflare\.com' \
            /tmp/tun.log | head -1)
          echo "::notice title=noVNC URL::${_url}"

      - name: Start Android emulator
        run: |
          export ANDROID_AVD_HOME="${ANDROID_AVD_HOME}"
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_GL_VERSION_OVERRIDE=4.5
          export MESA_GLSL_VERSION_OVERRIDE=450
          emulator \
            -avd ci_avd \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -memory 8192 \
            -cores 4 &
          echo "Waiting for emulator boot..."
          adb wait-for-device
          until [ "$(adb shell getprop sys.boot_completed 2>/dev/null \
            | tr -d '\r')" = "1" ]; do
            sleep 3
          done
          adb shell input keyevent 82
          echo "Emulator booted"

      - name: Spoof GPU as Adreno 740
        run: |
          adb root
          sleep 3
          adb remount || true
          adb shell "su -c 'mount -o rw,remount /system'" || true

          adb shell "su -c 'mkdir -p /sys/class/kgsl/kgsl-3d0'"
          adb shell "su -c 'echo Adreno™ 740 > /sys/class/kgsl/kgsl-3d0/gpu_model'"
          adb shell "su -c 'echo 587000 > /sys/class/kgsl/kgsl-3d0/gpuclk'"
          adb shell "su -c 'echo 587000 > /sys/class/kgsl/kgsl-3d0/max_gpuclk'"
          adb shell "su -c 'echo 1 > /sys/class/kgsl/kgsl-3d0/power_stats'"

          adb shell "setprop ro.hardware.egl adreno"
          adb shell "setprop ro.hardware.vulkan adreno"
          adb shell "setprop ro.opengles.version 196610"
          adb shell "setprop ro.board.platform taro"
          adb shell "setprop ro.gfx.driver.0 com.qualcomm.qti.gpudrivers.taro.api30"

      - name: Spoof device as Samsung Galaxy S23
        run: |
          adb shell "setprop ro.product.manufacturer Samsung"
          adb shell "setprop ro.product.brand samsung"
          adb shell "setprop ro.product.model SM-S918B"
          adb shell "setprop ro.product.name SM-S918B"
          adb shell "setprop ro.product.device SM-S918B"
          adb shell "setprop ro.build.type user"
          adb shell "setprop ro.debuggable 0"
          adb shell "setprop ro.secure 1"
          adb shell "setprop ro.build.fingerprint \
            samsung/SM-S918BXXU3BWLK/SM-S918B:13/TP1A.220624.014/S918BXXU3BWLK:user/release-keys"

      - name: Enable ARM native bridge
        run: |
          adb shell "getprop ro.dalvik.vm.native.bridge" || true
          HB=$(adb shell "ls /system/lib/libhoudini.so 2>/dev/null" || true)
          if [ -n "$HB" ]; then
            adb shell "setprop ro.dalvik.vm.native.bridge libhoudini.so"
            echo "Houdini enabled"
          else
            adb shell "setprop ro.dalvik.vm.native.bridge libndk_translation.so" || true
            echo "Trying libndk_translation"
          fi
          adb reboot
          adb wait-for-device
          until [ "$(adb shell getprop sys.boot_completed 2>/dev/null \
            | tr -d '\r')" = "1" ]; do
            sleep 3
          done
          echo "ARM bridge ready"

      - name: Session monitor
        run: |
          _tick=0
          while true; do
            sleep 60
            _tick=$(( _tick + 1 ))
            if (( _tick % 30 == 0 )); then
              grep -oP 'https://[a-z0-9\-]+\.trycloudflare\.com' \
                /tmp/tun.log | tail -1
            fi
          done
